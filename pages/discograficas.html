<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sellos Discográficos · Palmeras Records</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />

    <link rel="stylesheet" href="../src/css/styles.css" />
    <link rel="stylesheet" href="../src/css/hero.css" />
    <link rel="stylesheet" href="../src/css/footer.css" />
    <link rel="stylesheet" href="../src/css/labels.css" />
</head>

<body>

    <main-header></main-header>

    <section class="catalog-hero">
        <div class="container">
            <div class="hero-content">
                <span class="hero-eyebrow">Archivo Curado</span>
                <h1 class="hero-title">Sellos Discográficos</h1>
                <p class="hero-description">
                    Una cuidada selección de sellos independientes, prensajes artesanales y proyectos editoriales
                    que comparten nuestra visión por la pureza del sonido físico y el diseño gráfico en vinilo.
                </p>
            </div>
        </div>
    </section>

    <section class="label-toolbar" aria-label="Búsqueda y filtros de sellos">
        <div class="container">
            <form class="label-toolbar__form" role="search" onsubmit="event.preventDefault();">

                <search class="label-search">
                    <span class="material-symbols-outlined label-search__icon">search</span>
                    <input type="search" id="labelSearch" class="label-search__input"
                        placeholder="Buscar por sello o país..." autocomplete="off" />
                </search>

                <nav class="territory-filters" id="countryFilters" aria-label="Filtrar por país">
                    <button type="button" class="territory-pill active" data-country="all">Todos los países</button>
                </nav>

            </form>
        </div>
    </section>

    <section class="label-featured" aria-label="Sellos discográficos">
        <div class="container" id="labelsList">
            <p class="label-loading" role="status">Cargando sellos discográficos…</p>
        </div>
    </section>

    <main-footer></main-footer>

    <script type="module" src="../src/js/main.js"></script>
    <script type="module" src="../src/js/labels.js"></script>
</body>

</html>
