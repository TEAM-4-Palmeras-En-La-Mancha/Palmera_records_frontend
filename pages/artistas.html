<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artistas | Palmeras Records</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

    <link

    <link rel="stylesheet" href="../src/css/styles.css" />

<body>

    <main-header></main-header>

    <main id="main-content">

        <section class="catalog-hero">

                    <span class="hero-eyebrow">Catálogo Fonográfico</span>
                    <h1 class="hero-title">Artistas &amp; Novedades</h1>
                    <p class="hero-description">

                    </p>
                </div>
            </div>
        </section>

        <section class="artists-section" aria-label="Índice de artistas" id="artistas">
            <div class="container">
                <div class="artist-list" id="artistList">
                    <p class="artists-empty">Cargando artistas...</p>
                </div>
            </div>

    </main>

    <main-footer></main-footer>

    <script type="module" src="../src/js/main.js"></script>
