<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palmeras Records</title>

    <!-- Google Fonts: Inter y Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"

    <!-- Hoja de estilos externa -->
    <link rel="stylesheet" href="src/css/styles.css" />
</head>

<body>

    <header id="main-header">
        <div class="container header-container">
            <!-- Logotipo e indicativo -->
            <div class="header-brand">
                <a href="index.html" class="brand-logo">
                    <span class="brand-name">Palmeras Records</span>
                    <span class="brand-badge">Est. 1984</span>
                </a>
            </div>

            <!-- Navegación principal -->
            <nav class="header-nav" aria-label="Navegación principal">
                <a href="#" class="nav-link active">Catálogo</a>
                <a href="#" class="nav-link">Artistas</a>
                <a href="#" class="nav-link">Discográficas</a>
                <a href="#" class="nav-link">Filiales y Stock</a>
            </nav>

            <!-- Acción rápida / Carrito -->
            <div class="header-actions">
                <button class="cart-btn" aria-label="Ver carrito">
                    <span class="cart-label">Carrito (0)</span>
                </button>
            </div>
        </div>
    </header>

    <main id="main-content">
        <!-- Contenido y catálogo -->
    </main>

    <footer id="main-footer">
        <!-- Pie de página -->
    </footer>

</body>

</html>
